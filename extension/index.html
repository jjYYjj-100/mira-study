<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRA 学习台</title>
<style>
:root{color-scheme:dark;--bg:#10121a;--surface:#191d29;--line:#32384a;--ink:#f2f4fb;--muted:#b0b8ca;--accent:#d6f77d;--warm:#ffbd9f;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,select,textarea{font:inherit}button,select{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:.52rem .8rem}button{cursor:pointer}button:hover,select:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:#313b29;border-color:#7f9a4a;color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#1c2611;font-weight:750}button:disabled{opacity:.5;cursor:default}header{max-width:1170px;margin:auto;padding:2rem 1.5rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}header h1{font-size:1.45rem;margin:0}header strong{color:var(--accent);letter-spacing:.14em;margin-right:.65rem}.layout{max-width:1170px;margin:auto;padding:1rem 1.5rem 2rem;display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:1.2rem}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(1rem,3vw,2rem)}aside.panel{padding:1rem;align-self:start}aside h2{font-size:.96rem;margin:0 0 .6rem;color:var(--muted);font-weight:550}.topics{display:grid;gap:.35rem}.topics button{text-align:left;border-color:transparent}.topics button[aria-pressed=true]{border-color:#7f9a4a}.muted,small{color:var(--muted)}small{font-size:.88rem}.bar,.actions,.modes{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between}.progress{font-size:.9rem;color:var(--muted)}.progress b{color:var(--accent)}h2{font-size:clamp(1.25rem,3vw,1.7rem);line-height:1.35;margin:.8rem 0 1rem}h3{font-size:1rem;margin:1.1rem 0 .4rem}p{margin:.55rem 0}ul{margin:.5rem 0 1rem;padding-left:1.4rem}li{margin:.25rem 0}.clock{font:700 2rem/1.2 ui-monospace,monospace;color:var(--accent);font-variant-numeric:tabular-nums}.clock.rush{color:var(--warm)}.track{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:.6rem 0 1.35rem}.track div{height:100%;background:var(--accent);width:100%;transition:width .18s linear}.track div.rush{background:var(--warm)}textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);margin:.6rem 0;width:100%;padding:.8rem;min-height:8rem;resize:vertical}.choices{display:grid;gap:.55rem;padding:.8rem 0}.choices label{cursor:pointer;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--line);display:flex;gap:.6rem;align-items:baseline}.choices label:has(:checked){border-color:var(--accent);background:#313b29}input{accent-color:var(--accent)}blockquote{margin:.8rem 0;padding:.6rem .8rem;border-left:3px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}details{margin:1rem 0}.status{min-height:1.55rem;color:var(--warm)}.record{border-top:1px solid var(--line);padding:.85rem 0}.record:last-child{padding-bottom:0}.push{margin-top:1.2rem}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:0 .8rem 1.5rem;gap:.75rem}header{padding:1rem .8rem}.topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lesson{border-left:2px solid var(--line);padding-left:1rem;margin:.95rem 0 1.2rem}.lesson h3{color:var(--accent);margin-top:.8rem}.lesson p,.study-notes p{margin:.3rem 0 .85rem}.study-notes{border-top:1px solid var(--line);padding-top:.7rem}.reference a{color:var(--accent);font-size:.9rem}
.field{width:100%;margin:.5rem 0 1rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:.55rem .7rem;font:inherit}.field:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#add-topic{width:100%}.topics{max-height:60vh;overflow:auto}.topics button{overflow-wrap:anywhere}h2{overflow-wrap:anywhere}
.workspace{min-width:0}.capture-panel{margin-bottom:1rem}.capture-panel img{display:block;width:100%;max-height:45vh;object-fit:contain;border:1px solid var(--line);border-radius:10px;margin:.65rem 0 1rem;background:var(--bg)}.transfer{padding:0 .25rem}.transfer .actions{margin-top:.65rem}.transfer input{max-width:100%;color:var(--muted)}
</style>
</head>
<body>
<header><h1><strong>MIRA</strong>学习台</h1><nav class="actions" aria-label="页面"><button id="capture-setup">截图学习</button><button id="practice">计时练习</button><button id="review">复习队列</button></nav></header>
<div class="layout"><aside class="panel"><h2>面试学习主题</h2><button id="add-topic">新增主题</button><label class="sr-only" for="topic-search">搜索主题</label><input class="field" id="topic-search" type="search" placeholder="搜索主题"><div class="topics" id="topics"></div></aside>
<div class="workspace"><section class="panel capture-panel" id="capture-panel" hidden></section><main class="panel" id="main"></main><details class="transfer"><summary>迁移学习记录</summary><div class="actions"><button id="export-learning">导出备份</button><label for="import-learning">导入备份</label><input id="import-learning" type="file" accept=".json,application/json"></div><p id="transfer-status" class="muted" role="status"></p></details></div></div>
<script src="study.js"></script>
<script src="capture.js"></script>
</body>
</html>
